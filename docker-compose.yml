services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: snaplink
      POSTGRES_USER: snaplink
      POSTGRES_PASSWORD: snaplink
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://snaplink:snaplink@postgres:5432/snaplink
      REDIS_URL: redis://redis:6379

  worker:
    build: ./worker
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://snaplink:snaplink@postgres:5432/snaplink
      REDIS_URL: redis://redis:6379


  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
