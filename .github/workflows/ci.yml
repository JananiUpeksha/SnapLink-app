name: CI - Build, Scan, Push

on:
  push:
    branches: [main]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend, worker]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          load: true
          tags: jananiupeksha/snaplink-${{ matrix.service }}:${{ steps.vars.outputs.sha_short }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: jananiupeksha/snaplink-${{ matrix.service }}:${{ steps.vars.outputs.sha_short }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            jananiupeksha/snaplink-${{ matrix.service }}:${{ steps.vars.outputs.sha_short }}
            jananiupeksha/snaplink-${{ matrix.service }}:latest
